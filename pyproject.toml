[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codex-to-hermes"
version = "1.0.0"
description = "Convert Codex CLI skills to Hermes Agent format with malware scanning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ykycportal"}
]
keywords = ["codex", "hermes", "skills", "converter", "security"]

dependencies = []

[project.optional-dependencies]
scan = []
dev = ["pytest>=8.0.0"]

[project.scripts]
codex-to-hermes = "codex_to_hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
